[project]
name = "ruka"
version = "0.1.0"
description = "Toy harness project"
readme = "README.md"
authors = [
    { name = "Afonso Lucas", email = "ifonso.developer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
ruka = "ruka_app.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ruka_ai", "ruka_agent", "ruka_app"]
